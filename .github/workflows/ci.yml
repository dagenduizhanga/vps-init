name: Shell checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: shell-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: shellcheck -x install.sh vps-init.sh lib/*.sh modules/*.sh ssh-key-only.sh tests/*.sh
      - name: Bash 语法与冒烟测试
        run: bash tests/smoke.sh
