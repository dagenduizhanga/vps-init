name: 测试

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck 与冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y -q shellcheck
          shellcheck -x install.sh vps-init.sh ssh-key-only.sh lib/*.sh modules/*.sh tests/*.sh
      - name: 冒烟测试（非 root）
        run: bash tests/smoke.sh

  interactive:
    name: 交互流程 · 真实 systemd
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: sudo apt-get update -q && sudo apt-get install -y -q openssh-server python3-pexpect
      - name: SSH 模块（真实 sshd 重载）
        run: sudo bash tests/ssh.sh
      - name: SSH 向导、主菜单、防火墙交互
        run: sudo python3 tests/interactive.py

  distros:
    name: SSH 模块 · ${{ matrix.image }}
    needs: lint
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [debian:11, debian:12, ubuntu:20.04, ubuntu:22.04, ubuntu:24.04, almalinux:9]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 OpenSSH
        run: |
          if command -v apt-get >/dev/null; then
            # Debian 11 长期支持已结束，安全源的软件包已下架，改从主仓库安装
            if grep -q bullseye /etc/os-release; then sed -i '/security/d' /etc/apt/sources.list; fi
            apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server
          else
            dnf install -y -q openssh-server openssh-clients util-linux && ssh-keygen -A
          fi
      - name: SSH 模块行为测试
        run: bash tests/ssh.sh
